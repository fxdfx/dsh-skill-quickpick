# dsh-skill-quickpick bundle patch
#
# 纯客户端插件：host 侧 index.js 是空实现，只用于让 loader 有一行 entry。
# 真正的 UI 在 client.js（dsh.client 声明触发浏览器半边加载）。
#
# id 必须与 client.js 里 window.__ModuleLoader__.load 的 id 一致，
# 否则会报 "loaded without registering <id>"。
- insert:
    - id: skill-quickpick
      name: dsh-skill-quickpick
